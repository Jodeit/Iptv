# Cloudflare deploy: serves the app as static assets and runs proxy/worker.js for /proxy,
# so the player and its CORS proxy share one HTTPS origin (no Proxy URL setting needed).
# Cloudflare dashboard → Workers & Pages → Create → Import a repository → this repo.
name = "o3xr-iptv"
main = "proxy/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "."

# Profile sync storage. No id needed: Wrangler creates the namespace on first deploy.
[[kv_namespaces]]
binding = "PROFILES"

# PR branches build with `wrangler preview`, which needs this block. Previews get no bindings
# unless they're listed here, so profile sync is off in them (the worker answers 503) and
# they can't touch the real profiles.
[previews]
