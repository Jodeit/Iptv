name: Android TV APK

on:
  push:
    paths: ['android-tv/**', 'js/tv.js', '.github/workflows/android-tv.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: Page the app loads
        default: https://iptv.jodeit.workers.dev

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleRelease -PappUrl="${{ inputs.app_url || 'https://iptv.jodeit.workers.dev' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tuner-tv-apk
          path: android-tv/app/build/outputs/apk/release/app-release.apk
      # Keeps one rolling prerelease with the newest APK so there is a stable download page.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-tv/app/build/outputs/apk/release/app-release.apk tuner-tv.apk
          gh release delete tv-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create tv-latest tuner-tv.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Tuner TV (latest build)" --notes "Debug-signed APK for sideloading on Google TV. Built from $GITHUB_SHA."
      # The Cloudflare Worker serves the repo root, so this makes the APK downloadable at /tuner-tv.apk
      # on the app's own (public) URL even while the repo is private. The token's push doesn't re-trigger CI.
      - name: Commit APK for the Worker to serve
        run: |
          cp android-tv/app/build/outputs/apk/release/app-release.apk tuner-tv.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuner-tv.apk
          git commit -m "Update tuner-tv.apk [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
