name: Android TV APK

on:
  push:
    paths: ['android-tv/**', 'js/tv.js', '.github/workflows/android-tv.yml']
  workflow_dispatch:
    inputs:
      app_url:
        description: Page the app loads
        default: https://iptv.jodeit.workers.dev

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleRelease -PappUrl="${{ inputs.app_url || 'https://iptv.jodeit.workers.dev' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tuner-tv-apk
          path: android-tv/app/build/outputs/apk/release/app-release.apk
